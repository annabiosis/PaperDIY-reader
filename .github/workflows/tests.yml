name: host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh
